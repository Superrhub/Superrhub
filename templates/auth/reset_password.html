{% extends 'base.html' %}
{% block title %}Set New Password — SuperHub{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-16"
     style="background: radial-gradient(ellipse at center, #000d1a 0%, #0a0a0a 70%);">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="{% url 'home' %}" class="inline-flex items-center gap-2 mb-4">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center font-serif font-bold text-white text-xl"
             style="background: linear-gradient(135deg, #60a5fa, #0066ff);">S</div>
      </a>
      <h1 class="text-2xl font-bold text-white font-serif">Set New Password</h1>
      <p class="text-gray-500 text-sm mt-1">Choose a strong password for your account</p>
    </div>

    <!-- Card -->
    <div class="rounded-2xl border p-8" style="background:#0d0d1a; border-color:#1a1a2e;">

      {% if error %}
        <div class="msg-error px-4 py-3 rounded-lg mb-5 text-sm">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{% url 'reset_password' token=token %}" class="space-y-5">
        {% csrf_token %}

        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1.5">New Password</label>
          <input
            type="password"
            name="password"
            required
            minlength="8"
            placeholder="At least 8 characters"
            class="form-input w-full"
            autofocus
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1.5">Confirm New Password</label>
          <input
            type="password"
            name="confirm_password"
            required
            minlength="8"
            placeholder="Repeat your new password"
            class="form-input w-full"
          >
        </div>

        <button type="submit" class="btn-primary w-full justify-center py-3 text-base mt-2">
          Update Password
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        <a href="{% url 'login' %}" class="text-blue-500 hover:text-blue-300 font-medium transition-colors">
          Back to Login
        </a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
