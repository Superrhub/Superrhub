<a href="{% url 'story_detail' story.id %}" class="story-card group">
  <!-- Cover -->
  <div class="relative" style="aspect-ratio: 2/3;">
    {% if story.cover_image %}
      <img src="{{ story.cover_image }}" alt="{{ story.title }}"
           class="w-full h-full object-cover" loading="lazy" />
    {% else %}
      <div class="cover-placeholder w-full h-full bg-gradient-to-br {{ story.cover_color }}">
        <span class="text-4xl font-serif font-bold opacity-40 select-none">
          {{ story.title|first|upper }}
        </span>
      </div>
    {% endif %}
    <!-- Genre badge overlay -->
    <div class="absolute top-2 left-2">
      <span class="genre-badge text-xs">{{ story.genre }}</span>
    </div>
    {% if story.is_completed %}
      <div class="absolute top-2 right-2">
        <span class="px-1.5 py-0.5 rounded text-xs font-semibold bg-green-900/70 text-green-400 border border-green-800/50">
          ✓
        </span>
      </div>
    {% endif %}
  </div>

  <!-- Info -->
  <div class="p-3">
    <h3 class="text-white text-sm font-semibold leading-tight line-clamp-2 mb-1 group-hover:text-gold-400 transition-colors">
      {{ story.title }}
    </h3>
    <p class="text-gray-500 text-xs mb-2 truncate">{{ story.author_username }}</p>
    <div class="flex items-center gap-3 text-xs text-gray-600">
      <span title="Views">👁 {{ story.views_count }}</span>
      <span title="Likes">❤️ {{ story.likes_count }}</span>
      <span title="Chapters">📖 {{ story.chapters_count }}</span>
    </div>
  </div>
</a>
